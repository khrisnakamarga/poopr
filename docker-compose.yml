services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poopr
      POSTGRES_USER: poopr
      POSTGRES_PASSWORD: poopr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://poopr:poopr@postgres:5432/poopr
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:

